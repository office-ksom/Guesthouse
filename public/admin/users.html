<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Users — KSoM Guesthouse Admin</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23003366'/><text y='22' x='6' font-size='18' font-weight='bold' font-family='Arial' fill='%23FF9933'>K</text></svg>"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body>
<div class="admin-layout" id="app"></div>
<script type="module">
import { initAdminLayout, api, user as currentUser } from '/js/auth.js';
import { renderAdminShell, renderAdminTopbar } from '/js/admin/shell.js';
import { formatDatetime, statusBadge, toast, confirm } from '/js/ui.js';

document.getElementById('app').innerHTML = `
  ${renderAdminShell()}
  <div class="admin-main">
    ${renderAdminTopbar('Staff Users', 'Manage portal access and roles')}
    <div class="admin-content">
      <div class="data-table-wrapper">
        <div class="data-table-header">
          <span class="data-table-header__title">🔑 Staff Users</span>
          <button class="btn btn-primary btn-sm" id="add-user-btn">+ Add Staff</button>
        </div>
        <div id="users-wrap">
          <div style="padding:3rem;text-align:center"><div class="spinner" style="margin:0 auto 1rem"></div><p>Loading users…</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- User Modal -->
  <div class="modal-overlay" id="user-modal" style="display:none">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="um-title">Add Staff Member</h3>
        <span class="modal__close" id="um-close">✕</span>
      </div>
      <div class="modal__body">
        <form id="user-form">
          <input type="hidden" id="um-id"/>
          <div class="form-group" style="margin-bottom:var(--space-4);">
            <label class="form-label required">Full Name</label>
            <input class="form-control" id="um-name" placeholder="Staff member's name" required/>
          </div>
          <div class="form-group" style="margin-bottom:var(--space-4);">
            <label class="form-label required">Email Address</label>
            <input class="form-control" type="email" id="um-email" placeholder="staff@ksom.res.in" required/>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-4);">
            <div class="form-group">
              <label class="form-label required">Role</label>
              <select class="form-control" id="um-role">
                <option value="receptionist">Receptionist</option>
                <option value="viewer">Viewer</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="form-control" id="um-active">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>
          </div>
        </form>
        <div style="background:var(--blue-50);border-radius:var(--radius-md);padding:var(--space-4);font-size:0.8rem;color:var(--blue-700)">
          <strong>Role Permissions:</strong><br/>
          🔵 <strong>Admin</strong> — Full access including user management<br/>
          🟠 <strong>Receptionist</strong> — Manage bookings, guests, invoices<br/>
          ⚪ <strong>Viewer</strong> — Read-only access to all data
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn-ghost btn-sm" id="um-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="um-save">Save</button>
      </div>
    </div>
  </div>
`;

initAdminLayout('Staff Users', 'users');

let editingId = null;
const modal = document.getElementById('user-modal');

async function loadUsers() {
  const wrap = document.getElementById('users-wrap');
  try {
    const data = await api.getUsers();
    const users = data.users || [];
    if (!users.length) { wrap.innerHTML = `<div style="padding:3rem;text-align:center;color:var(--text-muted)">No users found.</div>`; return; }
    wrap.innerHTML = `
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:var(--space-3);">
                    <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--blue-500));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.875rem;flex-shrink:0">${u.name.charAt(0).toUpperCase()}</div>
                    <div>
                      <div style="font-weight:700;font-size:0.875rem">${u.name}${u.id===currentUser?.id?' <span style="font-size:0.7rem;color:var(--primary)">(you)</span>':''}</div>
                    </div>
                  </div>
                </td>
                <td style="font-size:0.875rem">${u.email}</td>
                <td>${statusBadge(u.role)}</td>
                <td><span style="font-size:0.8rem;font-weight:600;color:${u.is_active?'var(--success)':'var(--text-muted)'}">${u.is_active?'● Active':'● Inactive'}</span></td>
                <td style="font-size:0.8rem;color:var(--text-muted)">${u.last_login ? formatDatetime(u.last_login) : 'Never'}</td>
                <td>
                  <div class="table-actions">
                    <button class="icon-btn icon-btn-edit" onclick="editUser(${u.id})" title="Edit">✏️</button>
                    ${u.id !== currentUser?.id ? `<button class="icon-btn icon-btn-delete" onclick="toggleUser(${u.id},${u.is_active})" title="${u.is_active?'Deactivate':'Activate'}">${u.is_active?'🔴':'🟢'}</button>` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(e) {
    wrap.innerHTML = `<div style="padding:2rem;color:var(--error)">Failed to load users.</div>`;
  }
}

function openModal(user = null) {
  editingId = user?.id || null;
  document.getElementById('um-title').textContent = user ? 'Edit Staff Member' : 'Add Staff Member';
  document.getElementById('um-id').value = user?.id || '';
  document.getElementById('um-name').value = user?.name || '';
  document.getElementById('um-email').value = user?.email || '';
  document.getElementById('um-role').value = user?.role || 'receptionist';
  document.getElementById('um-active').value = String(user?.is_active ?? 1);
  document.getElementById('um-email').disabled = !!user;
  modal.style.display = 'flex';
}

window.editUser = async (id) => {
  try {
    const data = await api.getUsers();
    const u = (data.users || []).find(u => u.id === id);
    if (u) openModal(u);
  } catch(e) { toast('Failed to load user.', 'error'); }
};

window.toggleUser = async (id, current) => {
  confirm(`${current ? 'Deactivate' : 'Activate'} this user?`, async () => {
    try {
      await api.updateUser(id, { is_active: current ? 0 : 1 });
      toast(`User ${current ? 'deactivated' : 'activated'}.`);
      loadUsers();
    } catch(e) { toast(e.message || 'Failed to update user.', 'error'); }
  }, current ? true : false);
};

document.getElementById('add-user-btn').addEventListener('click', () => openModal());
document.getElementById('um-cancel').addEventListener('click', () => modal.style.display='none');
document.getElementById('um-close').addEventListener('click', () => modal.style.display='none');
modal.addEventListener('click', e => { if(e.target===modal) modal.style.display='none'; });

document.getElementById('um-save').addEventListener('click', async () => {
  const name     = document.getElementById('um-name').value.trim();
  const email    = document.getElementById('um-email').value.trim();
  const role     = document.getElementById('um-role').value;
  const isActive = parseInt(document.getElementById('um-active').value);

  if (!name || (!editingId && !email)) { toast('Name and email are required.', 'error'); return; }

  const body = { name, role, is_active: isActive };
  if (!editingId) { body.email = email; }

  const btn = document.getElementById('um-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (editingId) { await api.updateUser(editingId, body); toast('User updated!'); }
    else { await api.createUser(body); toast('Staff member created!'); }
    modal.style.display = 'none';
    loadUsers();
  } catch(e) { toast(e.message || 'Failed to save user.', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
});

loadUsers();
</script>
</body>
</html>
